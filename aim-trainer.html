<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Aim Trainer — Arm Practice</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0b0f17; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: #e6edf7;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #game {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    cursor: none;
    touch-action: none;
  }

  /* ---------- HUD ---------- */
  .hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    padding: 14px;
    pointer-events: none;
    z-index: 5;
  }
  .chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 92px;
    padding: 8px 14px;
    border-radius: 12px;
    background: rgba(18, 30, 48, 0.72);
    border: 1px solid rgba(120, 170, 255, 0.18);
    backdrop-filter: blur(6px);
    transition: border-color 0.2s ease;
  }
  .chip .label {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #7f93ad;
  }
  .chip .value {
    font-size: 20px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #dff1ff;
    line-height: 1.25;
  }
  .chip .value.hot { color: #7cf7c4; }
  .chip .value.warn { color: #ff8b8b; }

  /* ---------- Overlay ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 45%, rgba(11, 15, 23, 0.72), rgba(11, 15, 23, 0.96));
    z-index: 10;
    transition: opacity 0.25s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  .panel {
    width: min(460px, 90vw);
    padding: 28px 26px;
    border-radius: 20px;
    text-align: center;
    background: rgba(16, 24, 38, 0.94);
    border: 1px solid rgba(120, 170, 255, 0.22);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
  }
  .panel h1 {
    font-size: 27px;
    letter-spacing: 0.02em;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #7cf7c4, #4fd1ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .panel p {
    font-size: 14px;
    line-height: 1.75;
    color: #9fb2c8;
    margin-bottom: 8px;
  }
  .panel .hint {
    font-size: 13px;
    color: #7f93ad;
    margin-bottom: 20px;
  }
  .panel .hint b { color: #dff1ff; font-weight: 600; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin: 18px 0 22px;
  }
  .stats-grid .cell {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(120, 170, 255, 0.12);
    border-radius: 12px;
    padding: 10px 8px;
  }
  .stats-grid .cell span {
    display: block;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #7f93ad;
    margin-bottom: 4px;
  }
  .stats-grid .cell strong {
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    color: #dff1ff;
  }

  .btn {
    appearance: none;
    border: 0;
    cursor: pointer;
    font: inherit;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.04em;
    padding: 13px 42px;
    border-radius: 999px;
    color: #06131f;
    background: linear-gradient(135deg, #7cf7c4, #4fd1ff);
    box-shadow: 0 10px 30px rgba(79, 209, 255, 0.28);
    transition: transform 0.12s ease, box-shadow 0.2s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(79, 209, 255, 0.38); }
  .btn:active { transform: translateY(0) scale(0.98); }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="hud">
  <div class="chip"><span class="label">Time</span><span class="value" id="hudTime">60.0</span></div>
  <div class="chip"><span class="label">Score</span><span class="value" id="hudScore">0</span></div>
  <div class="chip"><span class="label">Accuracy</span><span class="value" id="hudAcc">100%</span></div>
  <div class="chip"><span class="label">Streak</span><span class="value" id="hudStreak">0</span></div>
</div>

<div class="overlay" id="overlay">
  <div class="panel" id="panel">
    <h1>Aim Trainer</h1>
    <p>Crosshair ko target par le jao aur <b>click</b> karo.</p>
    <p class="hint">Har target ka apna timer hai — jaldi maro, streak barhao.</p>
    <button class="btn" id="startBtn">Start</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  /* =========================================================
     Setup
     ========================================================= */
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const overlay = document.getElementById("overlay");
  const panel = document.getElementById("panel");
  const startBtn = document.getElementById("startBtn");

  const hudTime = document.getElementById("hudTime");
  const hudScore = document.getElementById("hudScore");
  const hudAcc = document.getElementById("hudAcc");
  const hudStreak = document.getElementById("hudStreak");

  const GAME_TIME = 60;        // seconds
  const MAX_TARGETS = 3;       // simultaneous targets
  const SMOOTH_BASE = 0.70;    // lower = smoother/slower crosshair

  let W = 0;
  let H = 0;
  let vignette = null;

  /* =========================================================
     State
     ========================================================= */
  const state = {
    running: false,
    timeLeft: GAME_TIME,
    score: 0,
    hits: 0,
    shots: 0,
    streak: 0,
    bestStreak: 0,
    targets: [],
    particles: [],
    ripples: [],
    shake: 0,
    hitFlash: 0
  };

  const aim = { x: 0, y: 0 };   // smoothed crosshair
  const raw = { x: 0, y: 0 };   // raw pointer

  /* =========================================================
     Helpers
     ========================================================= */
  const rand = (min, max) => min + Math.random() * (max - min);
  const clamp = (v, min, max) => (v < min ? min : v > max ? max : v);
  const lerp = (a, b, t) => a + (b - a) * t;

  function easeOutBack(x) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }

  /* =========================================================
     Audio (tiny WebAudio blips)
     ========================================================= */
  let audioCtx = null;

  function initAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }

  function beep(freq, dur, type = "sine", vol = 0.05) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.55), now + dur);

    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + dur + 0.02);
  }

  /* =========================================================
     Canvas sizing
     ========================================================= */
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // cache vignette gradient
    vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.78);
    vignette.addColorStop(0, "rgba(0,0,0,0)");
    vignette.addColorStop(1, "rgba(0,0,0,0.55)");

    // keep targets inside the new bounds
    for (const t of state.targets) {
      const pad = t.r + 20;
      t.x = clamp(t.x, pad, Math.max(pad, W - pad));
      t.y = clamp(t.y, pad, Math.max(pad, H - pad));
    }

    raw.x = clamp(raw.x || W / 2, 0, W);
    raw.y = clamp(raw.y || H / 2, 0, H);
    aim.x = clamp(aim.x || W / 2, 0, W);
    aim.y = clamp(aim.y || H / 2, 0, H);
  }

  /* =========================================================
     Targets
     ========================================================= */
  function difficulty() {
    return clamp(1 - state.timeLeft / GAME_TIME, 0, 1); // 0 -> easy, 1 -> hard
  }

  function spawnTarget() {
    const d = difficulty();
    const pad = 90;
    const minX = Math.min(pad, W / 2);
    const minY = Math.min(pad, H / 2);

    const r = lerp(48, 24, d) * rand(0.88, 1.12);
    const maxLife = lerp(2.6, 1.15, d) * rand(0.9, 1.15);

    let x = 0;
    let y = 0;
    let best = -1;

    // try a few times to avoid spawning on top of an existing target
    for (let attempt = 0; attempt < 12; attempt++) {
      const cx = rand(minX, Math.max(minX + 1, W - minX));
      const cy = rand(minY, Math.max(minY + 1, H - minY));
      let closest = Infinity;
      for (const t of state.targets) {
        const dist = Math.hypot(cx - t.x, cy - t.y) - t.r;
        if (dist < closest) closest = dist;
      }
      if (closest > best) {
        best = closest;
        x = cx;
        y = cy;
      }
      if (best > r * 2.4) break;
    }

    state.targets.push({
      x,
      y,
      r,
      age: 0,
      life: maxLife,
      maxLife,
      wobble: rand(0, Math.PI * 2),
      driftX: rand(-9, 9),
      driftY: rand(-9, 9)
    });
  }

  /* =========================================================
     Effects
     ========================================================= */
  function burst(x, y, r) {
    const count = 16;
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2 + rand(-0.2, 0.2);
      const speed = rand(90, 260);
      state.particles.push({
        x,
        y,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed,
        size: rand(1.6, 3.6),
        life: rand(0.28, 0.6),
        maxLife: 0.6,
        hue: Math.random() < 0.4 ? "#7cf7c4" : "#4fd1ff"
      });
    }
    state.ripples.push({ x, y, radius: r * 0.6, maxRadius: r * 2.6, life: 0.42, maxLife: 0.42 });
    state.hitFlash = 1;
  }

  function missEffect(x, y) {
    state.ripples.push({ x, y, radius: 2, maxRadius: 26, life: 0.26, maxLife: 0.26, bad: true });
  }

  /* =========================================================
     Game flow
     ========================================================= */
  function resetGame() {
    state.timeLeft = GAME_TIME;
    state.score = 0;
    state.hits = 0;
    state.shots = 0;
    state.streak = 0;
    state.bestStreak = 0;
    state.targets.length = 0;
    state.particles.length = 0;
    state.ripples.length = 0;
    state.shake = 0;
    state.hitFlash = 0;
    updateHud();
  }

  function startGame() {
    initAudio();
    resetGame();
    state.running = true;
    for (let i = 0; i < MAX_TARGETS; i++) spawnTarget();
    overlay.classList.add("hidden");
    beep(520, 0.12, "triangle", 0.04);
  }

  function endGame() {
    state.running = false;
    state.targets.length = 0;

    const acc = state.shots > 0 ? Math.round((state.hits / state.shots) * 100) : 100;

    panel.innerHTML =
      '<h1>Time Up!</h1>' +
      '<div class="stats-grid">' +
        '<div class="cell"><span>Score</span><strong>' + state.score + "</strong></div>" +
        '<div class="cell"><span>Accuracy</span><strong>' + acc + "%</strong></div>" +
        '<div class="cell"><span>Hits</span><strong>' + state.hits + "</strong></div>" +
        '<div class="cell"><span>Best Streak</span><strong>' + state.bestStreak + "</strong></div>" +
      "</div>" +
      '<button class="btn" id="startBtn">Play Again</button>';

    document.getElementById("startBtn").addEventListener("click", startGame);
    overlay.classList.remove("hidden");
    beep(300, 0.3, "sine", 0.05);
  }

  function updateHud() {
    hudTime.textContent = state.timeLeft.toFixed(1);
    hudScore.textContent = state.score;

    const acc = state.shots > 0 ? Math.round((state.hits / state.shots) * 100) : 100;
    hudAcc.textContent = acc + "%";
    hudStreak.textContent = state.streak;

    hudTime.classList.toggle("warn", state.timeLeft <= 10);
    hudAcc.classList.toggle("hot", acc >= 80 && state.shots >= 5);
    hudStreak.classList.toggle("hot", state.streak >= 5);
  }

  /* =========================================================
     Shooting
     ========================================================= */
  function shoot() {
    if (!state.running) return;

    state.shots++;

    let index = -1;
    for (let i = state.targets.length - 1; i >= 0; i--) {
      const t = state.targets[i];
      const dx = aim.x - t.x;
      const dy = aim.y - t.y;
      if (dx * dx + dy * dy <= t.r * t.r) {
        index = i;
        break;
      }
    }

    if (index >= 0) {
      const t = state.targets[index];
      state.targets.splice(index, 1);

      state.hits++;
      state.streak++;
      if (state.streak > state.bestStreak) state.bestStreak = state.streak;

      const bonus = Math.min(state.streak, 20) * 10;
      state.score += 100 + bonus;

      burst(t.x, t.y, t.r);
      beep(620 + Math.min(state.streak, 14) * 45, 0.08, "triangle", 0.045);
      spawnTarget();
    } else {
      state.streak = 0;
      state.score = Math.max(0, state.score - 15);
      state.shake = 7;
      missEffect(aim.x, aim.y);
      beep(150, 0.09, "sawtooth", 0.028);
    }

    updateHud();
  }

  /* =========================================================
     Update
     ========================================================= */
  function update(dt) {
    // --- smooth crosshair (frame-rate independent) ---
    const k = 1 - Math.pow(SMOOTH_BASE, dt * 60);
    aim.x += (raw.x - aim.x) * k;
    aim.y += (raw.y - aim.y) * k;

    // --- timer ---
    if (state.running) {
      state.timeLeft -= dt;
      if (state.timeLeft <= 0) {
        state.timeLeft = 0;
        updateHud();
        endGame();
      } else {
        updateHud();
      }
    }

    // --- targets ---
    for (let i = state.targets.length - 1; i >= 0; i--) {
      const t = state.targets[i];
      t.age += dt;
      t.wobble += dt * 1.6;

      // gentle drift so the target feels alive
      const drift = state.running ? 1 : 0.35;
      t.x += t.driftX * dt * drift;
      t.y += t.driftY * dt * drift;

      const pad = t.r + 12;
      if (t.x < pad || t.x > W - pad) {
        t.driftX *= -1;
        t.x = clamp(t.x, pad, Math.max(pad, W - pad));
      }
      if (t.y < pad || t.y > H - pad) {
        t.driftY *= -1;
        t.y = clamp(t.y, pad, Math.max(pad, H - pad));
      }

      if (state.running) {
        t.life -= dt;
        if (t.life <= 0) {
          state.targets.splice(i, 1);
          state.streak = 0;
          updateHud();
          spawnTarget();
        }
      }
    }

    // keep the arena populated
    if (state.running && state.targets.length < MAX_TARGETS) {
      spawnTarget();
    }

    // --- particles ---
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.life -= dt;
      if (p.life <= 0) {
        state.particles.splice(i, 1);
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.92;
      p.vy *= 0.92;
    }

    // --- ripples ---
    for (let i = state.ripples.length - 1; i >= 0; i--) {
      const r = state.ripples[i];
      r.life -= dt;
      if (r.life <= 0) {
        state.ripples.splice(i, 1);
        continue;
      }
      const p = 1 - r.life / r.maxLife;
      r.radius = lerp(r.radius, r.maxRadius, p * 0.35 + 0.1);
    }

    // --- misc decay ---
    state.shake *= Math.pow(0.001, dt);
    if (state.shake < 0.15) state.shake = 0;
    state.hitFlash = Math.max(0, state.hitFlash - dt * 4);
  }

  /* =========================================================
     Render
     ========================================================= */
  function drawBackground() {
    ctx.fillStyle = "#0b0f17";
    ctx.fillRect(0, 0, W, H);

    const gap = 64;
    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(120, 170, 255, 0.055)";
    ctx.beginPath();
    for (let x = 0.5; x <= W; x += gap) {
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
    }
    for (let y = 0.5; y <= H; y += gap) {
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
    }
    ctx.stroke();

    if (vignette) {
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawRipples() {
    for (const r of state.ripples) {
      const a = Math.max(0, r.life / r.maxLife);
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
      ctx.lineWidth = r.bad ? 2 : 3;
      ctx.strokeStyle = r.bad
        ? "rgba(255, 110, 110, " + (a * 0.7).toFixed(3) + ")"
        : "rgba(124, 247, 196, " + (a * 0.85).toFixed(3) + ")";
      ctx.stroke();
    }
  }

  function drawTargets() {
    for (const t of state.targets) {
      const grow = Math.min(1, t.age / 0.14);
      const s = Math.max(0, easeOutBack(grow));
      const r = t.r * s;
      if (r <= 0.5) continue;

      const lifeRatio = clamp(t.life / t.maxLife, 0, 1);
      const pulse = 1 + Math.sin(t.wobble) * 0.03;

      ctx.save();
      ctx.translate(t.x, t.y);
      ctx.scale(pulse, pulse);

      // soft glow
      ctx.shadowColor = "rgba(79, 209, 255, 0.75)";
      ctx.shadowBlur = 20;

      // body
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(18, 38, 63, 0.92)";
      ctx.fill();

      // outer ring
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#4fd1ff";
      ctx.stroke();

      ctx.shadowBlur = 0;

      // middle ring
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.58, 0, Math.PI * 2);
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(139, 233, 255, 0.75)";
      ctx.stroke();

      // bullseye
      ctx.beginPath();
      ctx.arc(0, 0, Math.max(2, r * 0.17), 0, Math.PI * 2);
      ctx.fillStyle = "#ff5f6d";
      ctx.fill();

      ctx.restore();

      // lifetime arc
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.r + 9, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * lifeRatio);
      ctx.lineWidth = 2;
      ctx.strokeStyle = lifeRatio < 0.3
        ? "rgba(255, 140, 140, 0.85)"
        : "rgba(255, 255, 255, 0.35)";
      ctx.stroke();
    }
  }

  function drawParticles() {
    for (const p of state.particles) {
      const a = clamp(p.life / p.maxLife, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.hue;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawCrosshair() {
    const x = aim.x;
    const y = aim.y;
    const flash = state.hitFlash;

    ctx.save();
    ctx.translate(x, y);

    // outer glow ring
    ctx.beginPath();
    ctx.arc(0, 0, 16 + flash * 8, 0, Math.PI * 2);
    ctx.lineWidth = 2;
    ctx.strokeStyle = flash > 0
      ? "rgba(124, 247, 196, " + (0.35 + flash * 0.6).toFixed(3) + ")"
      : "rgba(124, 247, 196, 0.35)";
    ctx.stroke();

    // cross lines
    const gap = 5 + flash * 3;
    const len = 11;
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#7cf7c4";
    ctx.shadowColor = "rgba(124, 247, 196, 0.85)";
    ctx.shadowBlur = 10;

    ctx.beginPath();
    ctx.moveTo(0, -gap); ctx.lineTo(0, -gap - len);
    ctx.moveTo(0, gap);  ctx.lineTo(0, gap + len);
    ctx.moveTo(-gap, 0); ctx.lineTo(-gap - len, 0);
    ctx.moveTo(gap, 0);  ctx.lineTo(gap + len, 0);
    ctx.stroke();

    // center dot
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(0, 0, 1.8, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();

    ctx.restore();
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    drawBackground();

    ctx.save();
    if (state.shake > 0) {
      ctx.translate(rand(-state.shake, state.shake), rand(-state.shake, state.shake));
    }
    drawRipples();
    drawTargets();
    drawParticles();
    ctx.restore();

    drawCrosshair();
  }

  /* =========================================================
     Loop
     ========================================================= */
  let last = performance.now();

  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    update(dt);
    render();

    requestAnimationFrame(loop);
  }

  /* =========================================================
     Input
     ========================================================= */
  canvas.addEventListener("pointermove", (e) => {
    raw.x = e.clientX;
    raw.y = e.clientY;
  });

  canvas.addEventListener("pointerdown", (e) => {
    initAudio();
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();

    // touch / pen: snap instantly so the tap lands where you pressed
    if (e.pointerType !== "mouse") {
      aim.x = e.clientX;
      aim.y = e.clientY;
    }
    raw.x = e.clientX;
    raw.y = e.clientY;

    shoot();
    e.preventDefault();
  });

  canvas.addEventListener("contextmenu", (e) => e.preventDefault());

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 120));

  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "Enter") {
      if (!state.running && !overlay.classList.contains("hidden")) {
        startGame();
        e.preventDefault();
      }
    }
  });

  startBtn.addEventListener("click", startGame);

  /* =========================================================
     Boot
     ========================================================= */
  raw.x = window.innerWidth / 2;
  raw.y = window.innerHeight / 2;
  aim.x = raw.x;
  aim.y = raw.y;

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
