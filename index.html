<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0b3d2e" />
<title>Astaghfar Counter — أستغفر الله</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<div class="bg-pattern" aria-hidden="true"></div>

<main class="app">
  <header class="app__header">
    <h1 class="app__title">Astaghfar Counter</h1>
    <p class="app__subtitle">أستغفر الله العظيم وأتوب إليه</p>
  </header>

  <section class="counter" aria-live="polite">
    <div class="counter__ring">
      <div class="counter__inner">
        <span class="counter__label">Today</span>
        <span class="counter__value" id="countDisplay">0</span>
        <span class="counter__unit">istighfar</span>
      </div>
    </div>
  </section>

  <section class="actions">
    <button class="btn btn--primary" id="tapBtn" aria-label="Count one istighfar">
      <span class="btn__arabic">أستغفر الله</span>
      <span class="btn__hint">Tap to count</span>
    </button>

    <div class="actions__row">
      <button class="btn btn--ghost" id="undoBtn" aria-label="Undo last count">↺ Undo</button>
      <button class="btn btn--ghost" id="resetBtn" aria-label="Reset counter">Reset</button>
      <button class="btn btn--ghost" id="soundBtn" aria-label="Toggle sound" aria-pressed="true">🔊 Sound</button>
    </div>
  </section>

  <section class="stats">
    <div class="stat">
      <span class="stat__label">Total (all time)</span>
      <span class="stat__value" id="totalDisplay">0</span>
    </div>
    <div class="stat">
      <span class="stat__label">Sessions</span>
      <span class="stat__value" id="sessionDisplay">0</span>
    </div>
  </section>

  <footer class="app__footer">
    <p>Remember Allah often, that you may succeed. — Qur'an 62:10</p>
  </footer>
</main>

<script src="./script.js"></script>
</body>
</html>
