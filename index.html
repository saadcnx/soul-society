<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Aim Trainer — Arm Practice</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #14120c; }
  body {
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    color: #e8dcc0;
    letter-spacing: 0.02em;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #game {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    cursor: none;
    touch-action: none;
  }

  /* ---------- HUD ---------- */
  .hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    padding: 14px;
    pointer-events: none;
    z-index: 5;
  }
  .chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 92px;
    padding: 8px 14px;
    border-radius: 4px;
    background: rgba(28, 24, 16, 0.88);
    border: 1px solid rgba(230, 170, 60, 0.4);
    box-shadow: inset 0 0 12px rgba(255, 150, 30, 0.06);
    transition: border-color 0.2s ease;
  }
  .chip .label {
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #a08d5e;
    font-weight: 600;
  }
  .chip .value {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #ffb347;
    line-height: 1.25;
    font-family: ui-monospace, "Courier New", monospace;
    text-shadow: 0 0 8px rgba(255, 150, 30, 0.35);
  }
  .chip .value.hot { color: #ffe27a; text-shadow: 0 0 10px rgba(255, 210, 80, 0.5); }
  .chip .value.warn { color: #ff5c33; text-shadow: 0 0 10px rgba(255, 60, 30, 0.5); }

  /* ---------- Overlay ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 45%, rgba(20, 18, 12, 0.82), rgba(10, 9, 6, 0.97));
    z-index: 10;
    transition: opacity 0.25s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  .panel {
    width: min(480px, 90vw);
    padding: 28px 26px;
    border-radius: 6px;
    text-align: center;
    background: rgba(22, 19, 13, 0.96);
    border: 1px solid rgba(230, 170, 60, 0.35);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), inset 0 0 40px rgba(255, 150, 30, 0.04);
  }
  .panel h1 {
    font-size: 28px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    margin-bottom: 14px;
    color: #ffb347;
    font-weight: 800;
    text-shadow: 0 0 20px rgba(255, 150, 30, 0.5);
  }
  .panel p {
    font-size: 14px;
    line-height: 1.75;
    color: #c9b98a;
    margin-bottom: 8px;
  }
  .panel .hint {
    font-size: 12px;
    color: #8a7d5c;
    margin-bottom: 20px;
    letter-spacing: 0.05em;
  }
  .panel .hint b { color: #ffb347; font-weight: 700; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin: 18px 0 22px;
  }
  .stats-grid .cell {
    background: rgba(255, 180, 70, 0.05);
    border: 1px solid rgba(230, 170, 60, 0.2);
    border-radius: 4px;
    padding: 10px 8px;
  }
  .stats-grid .cell span {
    display: block;
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #a08d5e;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .stats-grid .cell strong {
    font-size: 22px;
    font-variant-numeric: tabular-nums;
    color: #ffb347;
    font-family: ui-monospace, "Courier New", monospace;
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    margin: 0 0 20px;
    background: rgba(255, 180, 70, 0.05);
    border: 1px solid rgba(230, 170, 60, 0.2);
    border-radius: 4px;
  }
  .slider-row label {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #a08d5e;
    font-weight: 700;
    flex: 0 0 auto;
  }
  .slider-row input[type="range"] {
    flex: 1;
    appearance: none;
    -webkit-appearance: none;
    height: 4px;
    background: rgba(230, 170, 60, 0.25);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #ffb347;
    border: 2px solid #1a1000;
    box-shadow: 0 0 10px rgba(255, 150, 30, 0.7);
    cursor: pointer;
  }
  .slider-row input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #ffb347;
    border: 2px solid #1a1000;
    box-shadow: 0 0 10px rgba(255, 150, 30, 0.7);
    cursor: pointer;
  }
  .slider-row #sensValue {
    flex: 0 0 auto;
    min-width: 52px;
    text-align: right;
    font-family: ui-monospace, "Courier New", monospace;
    font-size: 13px;
    color: #ffb347;
    font-weight: 700;
  }

  .btn {
    appearance: none;
    border: 1px solid rgba(255, 200, 100, 0.5);
    cursor: pointer;
    font: inherit;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 13px 42px;
    border-radius: 4px;
    color: #1a1000;
    background: linear-gradient(135deg, #ffc46b, #ff8c1a);
    box-shadow: 0 10px 30px rgba(255, 140, 26, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    transition: transform 0.12s ease, box-shadow 0.2s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(255, 140, 26, 0.5); }
  .btn:active { transform: translateY(0) scale(0.98); }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="hud">
  <div class="chip"><span class="label">Time</span><span class="value" id="hudTime">60.0</span></div>
  <div class="chip"><span class="label">Score</span><span class="value" id="hudScore">0</span></div>
  <div class="chip"><span class="label">Accuracy</span><span class="value" id="hudAcc">100%</span></div>
  <div class="chip"><span class="label">Streak</span><span class="value" id="hudStreak">0</span></div>
</div>

<div class="overlay" id="overlay">
  <div class="panel" id="panel">
    <h1>Aim Trainer</h1>
    <p>Crosshair ko target par le jao aur <b>click</b> karo.</p>
    <p class="hint">Mouse lock ho jayega — <b>ESC</b> se unlock / pause.</p>
    <div class="slider-row">
      <label for="sensSlider">Sens</label>
      <input type="range" id="sensSlider" min="0.2" max="3" step="0.05" value="1" />
      <span id="sensValue">1.00x</span>
    </div>
    <button class="btn" id="startBtn">Start</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  /* =========================================================
     Setup
     ========================================================= */
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const overlay = document.getElementById("overlay");
  const panel = document.getElementById("panel");
  const startBtn = document.getElementById("startBtn");

  const hudTime = document.getElementById("hudTime");
  const hudScore = document.getElementById("hudScore");
  const hudAcc = document.getElementById("hudAcc");
  const hudStreak = document.getElementById("hudStreak");

  const GAME_TIME = 60;        // seconds
  const MAX_TARGETS = 3;       // simultaneous targets

  let W = 0;
  let H = 0;
  let DPR = 1;
  let vignette = null;
  let bgCanvas = null;
  let bgCtx = null;

  let sensitivity = 1.0;
  let pointerLocked = false;

  const sensSlider = document.getElementById("sensSlider");
  const sensValue = document.getElementById("sensValue");

  /* =========================================================
     State
     ========================================================= */
  const state = {
    running: false,
    timeLeft: GAME_TIME,
    score: 0,
    hits: 0,
    shots: 0,
    streak: 0,
    bestStreak: 0,
    targets: [],
    particles: [],
    ripples: [],
    shake: 0,
    hitFlash: 0
  };

  const aim = { x: 0, y: 0 };   // smoothed crosshair
  const raw = { x: 0, y: 0 };   // raw pointer

  /* =========================================================
     Helpers
     ========================================================= */
  const rand = (min, max) => min + Math.random() * (max - min);
  const clamp = (v, min, max) => (v < min ? min : v > max ? max : v);
  const lerp = (a, b, t) => a + (b - a) * t;

  function easeOutBack(x) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }

  /* =========================================================
     Audio (tiny WebAudio blips)
     ========================================================= */
  let audioCtx = null;

  function initAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }

  function beep(freq, dur, type = "sine", vol = 0.05) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.55), now + dur);

    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + dur + 0.02);
  }

  /* =========================================================
     Canvas sizing
     ========================================================= */
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    DPR = dpr;
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // cache vignette gradient
    vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.78);
    vignette.addColorStop(0, "rgba(0,0,0,0)");
    vignette.addColorStop(1, "rgba(0,0,0,0.72)");

    // Pre-render static background (grid + vignette) once per resize
    bgCanvas = document.createElement("canvas");
    bgCanvas.width = canvas.width;
    bgCanvas.height = canvas.height;
    bgCtx = bgCanvas.getContext("2d");
    bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    bgCtx.fillStyle = "#14120c";
    bgCtx.fillRect(0, 0, W, H);

    const gap = 64;
    bgCtx.lineWidth = 1;
    bgCtx.strokeStyle = "rgba(230, 170, 60, 0.06)";
    bgCtx.beginPath();
    for (let x = 0.5; x <= W; x += gap) {
      bgCtx.moveTo(x, 0);
      bgCtx.lineTo(x, H);
    }
    for (let y = 0.5; y <= H; y += gap) {
      bgCtx.moveTo(0, y);
      bgCtx.lineTo(W, y);
    }
    bgCtx.stroke();

    bgCtx.fillStyle = vignette;
    bgCtx.fillRect(0, 0, W, H);

    // keep targets inside the new bounds
    for (const t of state.targets) {
      const pad = t.r + 20;
      t.x = clamp(t.x, pad, Math.max(pad, W - pad));
      t.y = clamp(t.y, pad, Math.max(pad, H - pad));
    }

    raw.x = clamp(raw.x || W / 2, 0, W);
    raw.y = clamp(raw.y || H / 2, 0, H);
    aim.x = clamp(aim.x || W / 2, 0, W);
    aim.y = clamp(aim.y || H / 2, 0, H);
  }

  /* =========================================================
     Targets
     ========================================================= */
  function difficulty() {
    return clamp(1 - state.timeLeft / GAME_TIME, 0, 1); // 0 -> easy, 1 -> hard
  }

  function spawnTarget() {
    const d = difficulty();
    const pad = 90;
    const minX = Math.min(pad, W / 2);
    const minY = Math.min(pad, H / 2);

    const r = lerp(48, 24, d) * rand(0.88, 1.12);
    const maxLife = lerp(2.6, 1.15, d) * rand(0.9, 1.15);

    let x = 0;
    let y = 0;
    let best = -1;

    // try a few times to avoid spawning on top of an existing target
    for (let attempt = 0; attempt < 12; attempt++) {
      const cx = rand(minX, Math.max(minX + 1, W - minX));
      const cy = rand(minY, Math.max(minY + 1, H - minY));
      let closest = Infinity;
      for (const t of state.targets) {
        const dist = Math.hypot(cx - t.x, cy - t.y) - t.r;
        if (dist < closest) closest = dist;
      }
      if (closest > best) {
        best = closest;
        x = cx;
        y = cy;
      }
      if (best > r * 2.4) break;
    }

    state.targets.push({
      x,
      y,
      r,
      age: 0,
      life: maxLife,
      maxLife,
      wobble: rand(0, Math.PI * 2),
      driftX: rand(-9, 9),
      driftY: rand(-9, 9)
    });
  }

  /* =========================================================
     Effects
     ========================================================= */
  function burst(x, y, r) {
    const count = 8;
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2 + rand(-0.2, 0.2);
      const speed = rand(90, 260);
      state.particles.push({
        x,
        y,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed,
        size: rand(1.6, 3.6),
        life: rand(0.28, 0.6),
        maxLife: 0.6,
        hue: Math.random() < 0.4 ? "#ffe27a" : "#ff8c1a"
      });
    }
    state.ripples.push({ x, y, radius: r * 0.6, maxRadius: r * 2.6, life: 0.42, maxLife: 0.42 });
    state.hitFlash = 1;
  }

  function missEffect(x, y) {
    state.ripples.push({ x, y, radius: 2, maxRadius: 26, life: 0.26, maxLife: 0.26, bad: true });
  }

  /* =========================================================
     Game flow
     ========================================================= */
  function resetGame() {
    state.timeLeft = GAME_TIME;
    state.score = 0;
    state.hits = 0;
    state.shots = 0;
    state.streak = 0;
    state.bestStreak = 0;
    state.targets.length = 0;
    state.particles.length = 0;
    state.ripples.length = 0;
    state.shake = 0;
    state.hitFlash = 0;
    updateHud();
  }

  function startGame() {
    initAudio();
    resetGame();
    raw.x = W / 2;
    raw.y = H / 2;
    aim.x = raw.x;
    aim.y = raw.y;
    state.running = true;
    for (let i = 0; i < MAX_TARGETS; i++) spawnTarget();
    overlay.classList.add("hidden");
    requestPointerLock();
    beep(520, 0.12, "triangle", 0.04);
  }

  function endGame() {
    state.running = false;
    state.targets.length = 0;

    const acc = state.shots > 0 ? Math.round((state.hits / state.shots) * 100) : 100;

    panel.innerHTML =
      '<h1>Time Up!</h1>' +
      '<div class="stats-grid">' +
        '<div class="cell"><span>Score</span><strong>' + state.score + "</strong></div>" +
        '<div class="cell"><span>Accuracy</span><strong>' + acc + "%</strong></div>" +
        '<div class="cell"><span>Hits</span><strong>' + state.hits + "</strong></div>" +
        '<div class="cell"><span>Best Streak</span><strong>' + state.bestStreak + "</strong></div>" +
      "</div>" +
      '<div class="slider-row">' +
        '<label for="sensSlider">Sens</label>' +
        '<input type="range" id="sensSlider" min="0.2" max="3" step="0.05" value="' + sensitivity + '" />' +
        '<span id="sensValue">' + sensitivity.toFixed(2) + "x</span>" +
      "</div>" +
      '<button class="btn" id="startBtn">Play Again</button>';

    document.getElementById("startBtn").addEventListener("click", startGame);
    overlay.classList.remove("hidden");
    beep(300, 0.3, "sine", 0.05);
  }

  function updateHud() {
    hudTime.textContent = state.timeLeft.toFixed(1);
    hudScore.textContent = state.score;

    const acc = state.shots > 0 ? Math.round((state.hits / state.shots) * 100) : 100;
    hudAcc.textContent = acc + "%";
    hudStreak.textContent = state.streak;

    hudTime.classList.toggle("warn", state.timeLeft <= 10);
    hudAcc.classList.toggle("hot", acc >= 80 && state.shots >= 5);
    hudStreak.classList.toggle("hot", state.streak >= 5);
  }

  /* =========================================================
     Shooting
     ========================================================= */
  function shoot() {
    if (!state.running) return;

    state.shots++;

    let index = -1;
    for (let i = state.targets.length - 1; i >= 0; i--) {
      const t = state.targets[i];
      const dx = aim.x - t.x;
      const dy = aim.y - t.y;
      if (dx * dx + dy * dy <= t.r * t.r) {
        index = i;
        break;
      }
    }

    if (index >= 0) {
      const t = state.targets[index];
      state.targets.splice(index, 1);

      state.hits++;
      state.streak++;
      if (state.streak > state.bestStreak) state.bestStreak = state.streak;

      const bonus = Math.min(state.streak, 20) * 10;
      state.score += 100 + bonus;

      burst(t.x, t.y, t.r);
      beep(620 + Math.min(state.streak, 14) * 45, 0.08, "triangle", 0.045);
      spawnTarget();
    } else {
      state.streak = 0;
      state.score = Math.max(0, state.score - 15);
      state.shake = 7;
      missEffect(aim.x, aim.y);
      beep(150, 0.09, "sawtooth", 0.028);
    }

    updateHud();
  }

  /* =========================================================
     Update
     ========================================================= */
  function update(dt) {
    // --- crosshair follows instantly (no smoothing = no input delay) ---
    aim.x = raw.x;
    aim.y = raw.y;

    // --- timer ---
    if (state.running) {
      state.timeLeft -= dt;
      if (state.timeLeft <= 0) {
        state.timeLeft = 0;
        updateHud();
        endGame();
      } else {
        updateHud();
      }
    }

    // --- targets ---
    for (let i = state.targets.length - 1; i >= 0; i--) {
      const t = state.targets[i];
      t.age += dt;
      t.wobble += dt * 1.6;

      // gentle drift so the target feels alive
      const drift = state.running ? 1 : 0.35;
      t.x += t.driftX * dt * drift;
      t.y += t.driftY * dt * drift;

      const pad = t.r + 12;
      if (t.x < pad || t.x > W - pad) {
        t.driftX *= -1;
        t.x = clamp(t.x, pad, Math.max(pad, W - pad));
      }
      if (t.y < pad || t.y > H - pad) {
        t.driftY *= -1;
        t.y = clamp(t.y, pad, Math.max(pad, H - pad));
      }

      if (state.running) {
        t.life -= dt;
        if (t.life <= 0) {
          state.targets.splice(i, 1);
          state.streak = 0;
          updateHud();
          spawnTarget();
        }
      }
    }

    // keep the arena populated
    if (state.running && state.targets.length < MAX_TARGETS) {
      spawnTarget();
    }

    // --- particles ---
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.life -= dt;
      if (p.life <= 0) {
        state.particles.splice(i, 1);
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.92;
      p.vy *= 0.92;
    }

    // --- ripples ---
    for (let i = state.ripples.length - 1; i >= 0; i--) {
      const r = state.ripples[i];
      r.life -= dt;
      if (r.life <= 0) {
        state.ripples.splice(i, 1);
        continue;
      }
      const p = 1 - r.life / r.maxLife;
      r.radius = lerp(r.radius, r.maxRadius, p * 0.35 + 0.1);
    }

    // --- misc decay ---
    state.shake *= Math.pow(0.001, dt);
    if (state.shake < 0.15) state.shake = 0;
    state.hitFlash = Math.max(0, state.hitFlash - dt * 4);
  }

  /* =========================================================
     Render
     ========================================================= */
  function drawBackground() {
    if (bgCanvas) {
      ctx.drawImage(bgCanvas, 0, 0, W, H);
    } else {
      ctx.fillStyle = "#14120c";
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawRipples() {
    for (const r of state.ripples) {
      const a = Math.max(0, r.life / r.maxLife);
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
      ctx.lineWidth = r.bad ? 2 : 3;
      ctx.strokeStyle = r.bad
        ? "rgba(230, 60, 40, " + (a * 0.75).toFixed(3) + ")"
        : "rgba(255, 180, 70, " + (a * 0.85).toFixed(3) + ")";
      ctx.stroke();
    }
  }

  function drawTargets() {
    for (const t of state.targets) {
      const grow = Math.min(1, t.age / 0.14);
      const s = Math.max(0, easeOutBack(grow));
      const r = t.r * s;
      if (r <= 0.5) continue;

      const lifeRatio = clamp(t.life / t.maxLife, 0, 1);
      const pulse = 1 + Math.sin(t.wobble) * 0.03;

      ctx.save();
      ctx.translate(t.x, t.y);
      ctx.scale(pulse, pulse);

      // body — dark olive tactical
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(38, 32, 20, 0.94)";
      ctx.fill();

      // outer ring — amber
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#ffb347";
      ctx.stroke();

      // middle ring
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.58, 0, Math.PI * 2);
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(255, 200, 120, 0.8)";
      ctx.stroke();

      // bullseye — red-orange
      ctx.beginPath();
      ctx.arc(0, 0, Math.max(2, r * 0.17), 0, Math.PI * 2);
      ctx.fillStyle = "#e63a1e";
      ctx.fill();

      ctx.restore();

      // lifetime arc
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.r + 9, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * lifeRatio);
      ctx.lineWidth = 2;
      ctx.strokeStyle = lifeRatio < 0.3
        ? "rgba(255, 80, 40, 0.9)"
        : "rgba(255, 200, 120, 0.45)";
      ctx.stroke();
    }
  }

  function drawParticles() {
    for (const p of state.particles) {
      const a = clamp(p.life / p.maxLife, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.hue;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawCrosshair() {
    const x = aim.x;
    const y = aim.y;
    const flash = state.hitFlash;

    ctx.save();
    ctx.translate(x, y);

    // outer glow ring
    ctx.beginPath();
    ctx.arc(0, 0, 16 + flash * 8, 0, Math.PI * 2);
    ctx.lineWidth = 2;
    ctx.strokeStyle = flash > 0
      ? "rgba(255, 180, 70, " + (0.4 + flash * 0.6).toFixed(3) + ")"
      : "rgba(255, 180, 70, 0.4)";
    ctx.stroke();

    // cross lines
    const gap = 5 + flash * 3;
    const len = 11;
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#ffb347";

    ctx.beginPath();
    ctx.moveTo(0, -gap); ctx.lineTo(0, -gap - len);
    ctx.moveTo(0, gap);  ctx.lineTo(0, gap + len);
    ctx.moveTo(-gap, 0); ctx.lineTo(-gap - len, 0);
    ctx.moveTo(gap, 0);  ctx.lineTo(gap + len, 0);
    ctx.stroke();

    // center dot
    ctx.beginPath();
    ctx.arc(0, 0, 1.8, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();

    ctx.restore();
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    drawBackground();

    ctx.save();
    if (state.shake > 0) {
      ctx.translate(rand(-state.shake, state.shake), rand(-state.shake, state.shake));
    }
    drawRipples();
    drawTargets();
    drawParticles();
    ctx.restore();

    drawCrosshair();
  }

  /* =========================================================
     Loop
     ========================================================= */
  let last = performance.now();

  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    update(dt);
    render();

    requestAnimationFrame(loop);
  }

  /* =========================================================
     Input
     ========================================================= */
  function requestPointerLock() {
    if (!canvas.requestPointerLock) return;
    const p = canvas.requestPointerLock();
    if (p && p.catch) p.catch(() => {});
  }

  document.addEventListener("pointerlockchange", () => {
    pointerLocked = document.pointerLockElement === canvas;
    if (!pointerLocked && state.running) {
      // user pressed ESC — pause and show overlay
      state.running = false;
      overlay.classList.remove("hidden");
      panel.innerHTML =
        '<h1>Paused</h1>' +
        '<p>Mouse unlock ho gaya.</p>' +
        '<p class="hint"><b>Resume</b> dabao — cursor lock ho jayega.</p>' +
        '<div class="slider-row">' +
          '<label for="sensSlider">Sens</label>' +
          '<input type="range" id="sensSlider" min="0.2" max="3" step="0.05" value="' + sensitivity + '" />' +
          '<span id="sensValue">' + sensitivity.toFixed(2) + "x</span>" +
        "</div>" +
        '<button class="btn" id="startBtn">Resume</button>';
      document.getElementById("startBtn").addEventListener("click", () => {
        overlay.classList.add("hidden");
        state.running = true;
        requestPointerLock();
      });
    }
  });

  canvas.addEventListener("pointermove", (e) => {
    if (pointerLocked) {
      // relative movement scaled by sensitivity — zero smoothing
      raw.x = clamp(raw.x + e.movementX * sensitivity, 0, W);
      raw.y = clamp(raw.y + e.movementY * sensitivity, 0, H);
    } else {
      raw.x = e.clientX;
      raw.y = e.clientY;
    }
  });

  canvas.addEventListener("pointerdown", (e) => {
    initAudio();
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();

    // If game running and pointer not locked, lock it first (mouse only)
    if (state.running && !pointerLocked && e.pointerType === "mouse") {
      requestPointerLock();
      e.preventDefault();
      return;
    }

    // touch / pen: snap instantly so the tap lands where you pressed
    if (e.pointerType !== "mouse") {
      aim.x = e.clientX;
      aim.y = e.clientY;
      raw.x = e.clientX;
      raw.y = e.clientY;
    }

    shoot();
    e.preventDefault();
  });

  canvas.addEventListener("contextmenu", (e) => e.preventDefault());

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 120));

  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "Enter") {
      if (!state.running && !overlay.classList.contains("hidden")) {
        startGame();
        e.preventDefault();
      }
    }
  });

  startBtn.addEventListener("click", startGame);

  // Load saved sensitivity
  try {
    const saved = parseFloat(localStorage.getItem("aim_sens"));
    if (saved && saved >= 0.2 && saved <= 3) sensitivity = saved;
  } catch (e) {}

  if (sensSlider) sensSlider.value = String(sensitivity);
  if (sensValue) sensValue.textContent = sensitivity.toFixed(2) + "x";

  // Delegated input handler (works after panel.innerHTML rebuilds)
  panel.addEventListener("input", (e) => {
    if (e.target && e.target.id === "sensSlider") {
      sensitivity = parseFloat(e.target.value);
      const valEl = document.getElementById("sensValue");
      if (valEl) valEl.textContent = sensitivity.toFixed(2) + "x";
      try { localStorage.setItem("aim_sens", String(sensitivity)); } catch (e2) {}
    }
  });

  /* =========================================================
     Boot
     ========================================================= */
  raw.x = window.innerWidth / 2;
  raw.y = window.innerHeight / 2;
  aim.x = raw.x;
  aim.y = raw.y;

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
