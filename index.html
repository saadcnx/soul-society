<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Minecraft Aim Arena</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #14120c; }
  body {
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    color: #e8dcc0; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: none; touch-action: none; }

  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    padding: 12px; pointer-events: none; z-index: 5;
  }
  .chip {
    display: flex; flex-direction: column; align-items: center;
    min-width: 82px; padding: 6px 12px; border-radius: 4px;
    background: rgba(20, 20, 20, 0.72);
    border: 1px solid rgba(120, 90, 40, 0.55);
  }
  .chip .label {
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #a08d5e; font-weight: 600;
  }
  .chip .value {
    font-size: 20px; font-weight: 700;
    font-family: ui-monospace, "Courier New", monospace;
    color: #ffd566; line-height: 1.2;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.6);
  }
  .chip .value.hot { color: #ffe27a; }
  .chip.ammo { min-width: 110px; border-color: rgba(255, 200, 100, 0.7); }
  .chip.ammo.reloading .value { color: #ff5c33; }
  .chip.ammo.empty .value { color: #ff2020; }

  .overlay {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: rgba(10, 9, 6, 0.92); z-index: 10; cursor: default;
    padding: 20px; overflow-y: auto;
  }
  .overlay.hidden { display: none; }

  .panel {
    width: min(560px, 92vw); padding: 26px 24px;
    background: rgba(24, 20, 14, 0.98);
    border: 3px solid rgba(120, 90, 40, 0.9);
    border-radius: 0; text-align: center;
    box-shadow: inset 0 0 0 3px rgba(60, 45, 20, 0.6), 0 20px 60px rgba(0,0,0,0.8);
  }
  .panel h1 {
    font-size: 22px; letter-spacing: 0.24em; text-transform: uppercase;
    margin-bottom: 16px; color: #ffd566; font-weight: 800;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.7);
  }
  .panel p { font-size: 13px; line-height: 1.7; color: #c9b98a; margin-bottom: 8px; }
  .panel .hint { font-size: 12px; color: #a08d5e; margin-bottom: 14px; letter-spacing: 0.04em; }
  .panel .hint b { color: #ffd566; }

  .keys-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 6px; margin: 12px 0 18px; text-align: left;
    font-size: 12px; color: #c9b98a;
  }
  .keys-grid div {
    padding: 6px 10px;
    background: rgba(255, 200, 100, 0.05);
    border: 1px solid rgba(120, 90, 40, 0.5);
  }
  .keys-grid kbd {
    display: inline-block; padding: 1px 6px; margin-right: 6px;
    background: #3a2f1c; border: 1px solid #5c4a2c;
    font-family: ui-monospace, monospace; font-size: 11px;
    color: #ffd566; border-radius: 2px; box-shadow: 0 2px 0 #1a1208;
  }

  .btn {
    appearance: none; cursor: pointer; font: inherit;
    font-weight: 800; font-size: 14px;
    letter-spacing: 0.22em; text-transform: uppercase;
    padding: 12px 32px; border-radius: 0;
    color: #1a1000; background: #ffd566;
    border: 3px solid #7a5a1c;
    box-shadow: 0 4px 0 #4a3410, inset 0 2px 0 rgba(255,255,255,0.3);
    transition: transform 0.06s;
  }
  .btn:hover { background: #ffe27a; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #4a3410, inset 0 2px 0 rgba(255,255,255,0.3); }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="hud">
  <div class="chip"><span class="label">Score</span><span class="value" id="hudScore">0</span></div>
  <div class="chip"><span class="label">Kills</span><span class="value" id="hudKills">0</span></div>
  <div class="chip"><span class="label">Combo</span><span class="value" id="hudCombo">x1</span></div>
  <div class="chip ammo" id="hudAmmoChip"><span class="label">Ammo</span><span class="value" id="hudAmmo">30 / 30</span></div>
</div>

<div class="overlay" id="overlay">
  <div class="panel" id="panel">
    <h1>Minecraft Aim Arena</h1>
    <p>Arena me ghoomo, bhaago, koodo aur dummies ko goli maaro.</p>
    <div class="keys-grid">
      <div><kbd>A</kbd><kbd>D</kbd> Move</div>
      <div><kbd>Shift</kbd> Run</div>
      <div><kbd>Space</kbd> Jump</div>
      <div><kbd>R</kbd> Reload</div>
      <div><kbd>Mouse</kbd> Aim</div>
      <div><kbd>Click</kbd> Fire (hold = auto)</div>
    </div>
    <p class="hint">Dummy <b>3 hits</b> me gir jata hai. Jaldi maaro = zyada combo.</p>
    <button class="btn" id="startBtn">Start</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* =========================================================
     Canvas
     ========================================================= */
  let canvas, ctx;
  try {
    canvas = document.getElementById("game");
    ctx = canvas.getContext("2d");
  } catch (err) {
    console.error("Canvas init failed:", err);
  }
  const overlay = document.getElementById("overlay");
  const panel = document.getElementById("panel");
  const startBtn = document.getElementById("startBtn");

  const hudScore = document.getElementById("hudScore");
  const hudKills = document.getElementById("hudKills");
  const hudCombo = document.getElementById("hudCombo");
  const hudAmmoChip = document.getElementById("hudAmmoChip");
  const hudAmmo = document.getElementById("hudAmmo");

  let W = 0, H = 0, DPR = 1;
  function resize() {
    try {
      if (!canvas || !ctx) return;
      DPR = Math.min(window.devicePixelRatio || 1, 1.5);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.floor(W * DPR);
      canvas.height = Math.floor(H * DPR);
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.imageSmoothingEnabled = false;
    } catch (err) {
      console.error("Resize failed:", err);
    }
  }

  /* =========================================================
     Constants
     ========================================================= */
  const BLOCK = 40;
  const GRAVITY = 1900;
  const JUMP_VEL = -640;
  const WALK_SPEED = 210;
  const RUN_SPEED = 400;
  const ACCEL = 2200;
  const FRICTION = 2400;
  const AIR_FRICTION = 400;

  const WORLD_W = 3200;
  const WORLD_H = 1000;
  const GROUND_ROW = 14;      // ground top row index
  const GROUND_Y = GROUND_ROW * BLOCK;

  const MAG_SIZE = 30;
  const FIRE_DELAY = 95;      // ms
  const RELOAD_TIME = 1500;   // ms
  const BULLET_SPEED = 2400;

  /* =========================================================
     Palette (Minecraft-ish)
     ========================================================= */
  const COL = {
    sky: "#8fc4e8",
    skyHigh: "#5aa8dc",
    sun: "#ffec8b",
    cloud: "#ffffff",
    grassTop: "#7cbd4a",
    grassTopDark: "#65a23c",
    grassSide: "#8a5a35",
    dirt: "#8a5a35",
    dirtDark: "#6e4526",
    dirtDarker: "#5a3520",
    stone: "#8a8a8a",
    stoneDark: "#6e6e6e",
    stoneDarker: "#545454",
    wood: "#8b6f3f",
    woodDark: "#6e5730",
    woodDarker: "#4f3d20",
    straw: "#e8c46a",
    strawDark: "#c9a44b",
    targetRed: "#d63a3a",
    targetWhite: "#f4ede0",
    skin: "#d3a373",
    skinDark: "#b8895b",
    hair: "#3a2818",
    shirt: "#2ea3d8",
    shirtDark: "#1e7ba8",
    pants: "#3b4d9c",
    pantsDark: "#2a3870",
    bullet: "#ffe27a",
    muzzle: "#ffdc7a"
  };

  /* =========================================================
     Texture helper
     ========================================================= */
  function hash2(x, y, s) {
    let h = Math.floor(x) * 374761393 + Math.floor(y) * 668265263 + (s || 0) * 1013904223;
    h = (h ^ (h >> 13)) * 1274126177;
    return ((h ^ (h >> 16)) >>> 0) / 4294967295;
  }

  /* =========================================================
     World
     ========================================================= */
  const world = {
    groundRow: GROUND_ROW,
    platforms: [],
    dummies: []
  };

  function generateWorld() {
    world.platforms = [
      // x, y (row), w (cols), h (rows), type
      { x: 5,  y: 10, w: 4, h: 1, type: "wood" },
      { x: 12, y: 8,  w: 5, h: 1, type: "wood" },
      { x: 20, y: 11, w: 3, h: 1, type: "stone" },
      { x: 26, y: 9,  w: 6, h: 1, type: "wood" },
      { x: 36, y: 10, w: 4, h: 1, type: "stone" },
      { x: 44, y: 7,  w: 5, h: 1, type: "wood" },
      { x: 52, y: 11, w: 4, h: 1, type: "wood" },
      { x: 60, y: 9,  w: 6, h: 1, type: "stone" },
      { x: 68, y: 10, w: 3, h: 1, type: "wood" },
      // tall pillars
      { x: 16, y: 12, w: 1, h: 2, type: "wood" },
      { x: 42, y: 12, w: 1, h: 2, type: "wood" },
      { x: 58, y: 12, w: 1, h: 2, type: "wood" }
    ];

    // solid platforms as rectangles for collision
    world.solids = world.platforms.map(function (p) {
      return {
        x: p.x * BLOCK,
        y: p.y * BLOCK,
        w: p.w * BLOCK,
        h: p.h * BLOCK,
        type: p.type
      };
    });
  }

  function spawnDummy(px, py) {
    return {
      x: px,
      y: py,
      vx: 0, vy: 0,
      w: 32, h: 72,
      hp: 3,
      maxHp: 3,
      alive: true,
      falling: 0,   // 0 = upright, 1 = fully fallen
      hitFlash: 0,
      sway: Math.random() * Math.PI * 2,
      respawnAt: 0
    };
  }

  function spawnDummiesInitial() {
    world.dummies.length = 0;
    const groundTopY = GROUND_Y;
    const cols = [
      6, 10, 15, 20, 24, 29, 34, 39, 45, 50, 56, 62, 68, 72
    ];
    for (const c of cols) {
      world.dummies.push(spawnDummy(c * BLOCK + 20, groundTopY - 72));
    }
  }

  /* =========================================================
     Player
     ========================================================= */
  const player = {
    x: 3 * BLOCK,
    y: GROUND_Y - 80,
    vx: 0, vy: 0,
    w: 32, h: 72,
    onGround: false,
    facing: 1,
    walkPhase: 0,
    walkAmount: 0
  };

  const aim = { x: 0, y: 0 };

  /* =========================================================
     Camera
     ========================================================= */
  const cam = { x: 0, y: 0, tx: 0, ty: 0 };

  function updateCamera(dt) {
    cam.tx = player.x + player.w / 2 - W / 2;
    cam.ty = player.y + player.h / 2 - H / 2 - 40;

    cam.tx = clamp(cam.tx, 0, Math.max(0, WORLD_W - W));
    cam.ty = clamp(cam.ty, -100, Math.max(0, WORLD_H - H));

    const k = 1 - Math.pow(0.001, dt);
    cam.x += (cam.tx - cam.x) * k;
    cam.y += (cam.ty - cam.y) * k;
  }

  /* =========================================================
     State
     ========================================================= */
  const state = {
    running: false,
    score: 0,
    kills: 0,
    combo: 1,
    comboTimer: 0,
    ammo: MAG_SIZE,
    reloading: false,
    reloadEndAt: 0,
    lastShotAt: 0,
    muzzleFlash: 0,
    bullets: [],
    keys: Object.create(null),
    mouseDown: false
  };

  /* =========================================================
     Audio (Minecraft-ish blips)
     ========================================================= */
  let audioCtx = null;
  function initAudio() {
    if (audioCtx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (err) {
      console.warn("AudioContext unavailable:", err);
      audioCtx = null;
    }
  }
  function blip(freq, dur, type, vol) {
    if (!audioCtx) return;
    try {
      const t = audioCtx.currentTime;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(60, freq * 0.6), t + dur);
      g.gain.setValueAtTime(vol || 0.05, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (err) {
      // audio graph may be torn down by browser (autoplay policy); ignore
    }
  }

  /* =========================================================
     Input
     ========================================================= */
  window.addEventListener("keydown", function (e) {
    state.keys[e.code] = true;
    if (e.code === "Space") e.preventDefault();
    if (e.code === "KeyR" && state.running) startReload();
  });
  window.addEventListener("keyup", function (e) {
    state.keys[e.code] = false;
  });

  canvas.addEventListener("mousemove", function (e) {
    aim.x = e.clientX;
    aim.y = e.clientY;
  });
  canvas.addEventListener("mousedown", function (e) {
    if (e.button === 0) {
      state.mouseDown = true;
      try {
        initAudio();
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      } catch (err) {
        console.warn("Audio resume failed:", err);
      }
      tryFire();
    }
  });
  window.addEventListener("mouseup", function (e) {
    if (e.button === 0) state.mouseDown = false;
  });
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  // touch: aim + fire
  canvas.addEventListener("touchstart", function (e) {
    try {
      initAudio();
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    } catch (err) {
      console.warn("Audio resume failed:", err);
    }
    const t = e.touches[0];
    aim.x = t.clientX; aim.y = t.clientY;
    state.mouseDown = true;
    tryFire();
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener("touchmove", function (e) {
    const t = e.touches[0];
    aim.x = t.clientX; aim.y = t.clientY;
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener("touchend", function () {
    state.mouseDown = false;
  });

  /* =========================================================
     Collision
     ========================================================= */
  function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  function getSolids() {
    // ground is a big strip
    const s = [{
      x: 0, y: GROUND_Y,
      w: WORLD_W, h: WORLD_H - GROUND_Y,
      type: "ground"
    }];
    for (const p of world.solids) s.push(p);
    return s;
  }

  function moveWithCollision(ent, dx, dy) {
    const solids = getSolids();

    // X
    ent.x += dx;
    for (const s of solids) {
      if (rectsOverlap(ent.x, ent.y, ent.w, ent.h, s.x, s.y, s.w, s.h)) {
        if (dx > 0) ent.x = s.x - ent.w;
        else if (dx < 0) ent.x = s.x + s.w;
        ent.vx = 0;
      }
    }

    // Y
    ent.onGround = false;
    ent.y += dy;
    for (const s of solids) {
      if (rectsOverlap(ent.x, ent.y, ent.w, ent.h, s.x, s.y, s.w, s.h)) {
        if (dy > 0) {
          ent.y = s.y - ent.h;
          ent.vy = 0;
          ent.onGround = true;
        } else if (dy < 0) {
          ent.y = s.y + s.h;
          ent.vy = 0;
        }
      }
    }
  }

  /* =========================================================
     Firing
     ========================================================= */
  function startReload() {
    if (state.reloading) return;
    if (state.ammo === MAG_SIZE) return;
    state.reloading = true;
    state.reloadEndAt = performance.now() + RELOAD_TIME;
    blip(280, 0.09, "square", 0.05);
    setTimeout(function () { blip(380, 0.09, "square", 0.05); }, 200);
    updateHud();
  }

  function finishReload() {
    state.ammo = MAG_SIZE;
    state.reloading = false;
    state.reloadEndAt = 0;
    blip(560, 0.1, "square", 0.06);
    updateHud();
  }

  function getHandPos() {
    const cx = player.x + player.w / 2;
    const cy = player.y + player.h * 0.55;
    return { x: cx, y: cy };
  }

  function getMuzzlePos() {
    const h = getHandPos();
    const a = Math.atan2(aim.y + cam.y - h.y, aim.x + cam.x - h.x);
    return {
      x: h.x + Math.cos(a) * 44,
      y: h.y + Math.sin(a) * 44,
      angle: a
    };
  }

  function tryFire() {
    if (!state.running) return;
    const now = performance.now();
    if (state.reloading) return;
    if (state.ammo <= 0) { startReload(); return; }
    if (now - state.lastShotAt < FIRE_DELAY) return;

    state.lastShotAt = now;
    state.ammo--;
    state.muzzleFlash = 1;
    blip(720 + Math.random() * 60, 0.06, "square", 0.055);
    blip(180, 0.08, "sawtooth", 0.03);

    const m = getMuzzlePos();
    const dx = (aim.x + cam.x) - m.x;
    const dy = (aim.y + cam.y) - m.y;
    const len = Math.hypot(dx, dy) || 1;
    state.bullets.push({
      x: m.x, y: m.y,
      vx: (dx / len) * BULLET_SPEED,
      vy: (dy / len) * BULLET_SPEED,
      life: 1.2,
      px: m.x, py: m.y
    });

    // combo increment on each shot attempt
    state.comboTimer = 1.6;

    if (state.ammo === 0) {
      setTimeout(function () {
        if (state.running && state.ammo === 0) startReload();
      }, 160);
    }

    updateHud();
  }

  /* =========================================================
     Update
     ========================================================= */
  function update(dt) {
    if (!state.running) return;

    /* ---- input ---- */
    const left = state.keys["KeyA"] || state.keys["ArrowLeft"];
    const right = state.keys["KeyD"] || state.keys["ArrowRight"];
    const run = state.keys["ShiftLeft"] || state.keys["ShiftRight"];
    const jump = state.keys["Space"];

    const maxSpeed = run ? RUN_SPEED : WALK_SPEED;
    let inputDir = 0;
    if (left) inputDir -= 1;
    if (right) inputDir += 1;

    if (inputDir !== 0) {
      player.vx += inputDir * ACCEL * dt;
      player.vx = clamp(player.vx, -maxSpeed, maxSpeed);
      player.facing = inputDir;
    } else {
      const fr = player.onGround ? FRICTION : AIR_FRICTION;
      const sign = Math.sign(player.vx);
      const mag = Math.min(Math.abs(player.vx), fr * dt);
      player.vx -= sign * mag;
    }

    if (jump && player.onGround) {
      player.vy = JUMP_VEL;
      player.onGround = false;
      blip(420, 0.08, "square", 0.04);
    }

    player.vy += GRAVITY * dt;
    if (player.vy > 1600) player.vy = 1600;

    moveWithCollision(player, player.vx * dt, player.vy * dt);

    player.x = clamp(player.x, 0, WORLD_W - player.w);

    // walk cycle
    const speedNorm = Math.min(1, Math.abs(player.vx) / RUN_SPEED);
    player.walkAmount += (speedNorm - player.walkAmount) * Math.min(1, dt * 10);
    if (player.onGround && Math.abs(player.vx) > 20) {
      player.walkPhase += dt * (6 + speedNorm * 8);
    } else if (!player.onGround) {
      player.walkPhase = 0;
    }

    /* ---- camera ---- */
    updateCamera(dt);

    /* ---- bullets ---- */
    for (let i = state.bullets.length - 1; i >= 0; i--) {
      const b = state.bullets[i];
      b.px = b.x; b.py = b.y;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;

      // hit dummy?
      let hit = false;
      for (const d of world.dummies) {
        if (!d.alive) continue;
        if (d.x - d.w / 2 < b.x && b.x < d.x + d.w / 2 &&
            d.y < b.y && b.y < d.y + d.h) {
          // hit!
          d.hp--;
          d.hitFlash = 1;
          state.score += 100 * state.combo;
          state.combo = Math.min(10, state.combo + 1);
          state.comboTimer = 1.6;
          blip(880, 0.05, "triangle", 0.05);
          if (d.hp <= 0) {
            d.alive = false;
            d.falling = 0.001;
            d.respawnAt = performance.now() + 1800;
            state.kills++;
            state.score += 250 * state.combo;
            blip(520, 0.2, "triangle", 0.07);
          }
          hit = true;
          break;
        }
      }
      if (hit || b.life <= 0 ||
          b.x < cam.x - 200 || b.x > cam.x + W + 200 ||
          b.y < cam.y - 200 || b.y > cam.y + H + 200) {
        state.bullets.splice(i, 1);
      }
    }

    /* ---- dummies ---- */
    const now = performance.now();
    for (const d of world.dummies) {
      // hit flash decay
      if (d.hitFlash > 0) d.hitFlash = Math.max(0, d.hitFlash - dt * 6);

      // sway idle animation
      d.sway += dt * 2;

      if (!d.alive) {
        // falling animation
        if (d.falling < 1) d.falling = Math.min(1, d.falling + dt * 3);
        // respawn?
        if (now >= d.respawnAt) {
          // pick a new position
          const r = Math.random();
          d.x = (3 + r * 70) * BLOCK;
          d.y = GROUND_Y - d.h;
          d.vx = 0; d.vy = 0;
          d.hp = d.maxHp;
          d.alive = true;
          d.falling = 0;
          d.hitFlash = 0;
        }
      } else {
        // gravity for falling dummies (from platform edges)
        d.vy += GRAVITY * dt * 0.5;
        if (d.vy > 1000) d.vy = 1000;
        const savedH = d.h;
        const ent = { x: d.x - d.w / 2, y: d.y, w: d.w, h: d.h, vx: 0, vy: d.vy, onGround: false };
        moveWithCollision(ent, 0, d.vy * dt);
        d.x = ent.x + d.w / 2;
        d.y = ent.y;
        d.vy = ent.vy;
      }
    }

    /* ---- combo timer ---- */
    if (state.comboTimer > 0) {
      state.comboTimer -= dt;
      if (state.comboTimer <= 0) {
        state.combo = 1;
        updateHud();
      }
    }

    /* ---- muzzle flash ---- */
    if (state.muzzleFlash > 0) state.muzzleFlash = Math.max(0, state.muzzleFlash - dt * 14);

    /* ---- reload ---- */
    if (state.reloading && now >= state.reloadEndAt) finishReload();

    /* ---- auto fire ---- */
    if (state.mouseDown && !state.reloading && state.ammo > 0) {
      tryFire();
    }

    /* ---- aim recompute (for crosshair facing) ---- */
    const handCx = player.x + player.w / 2;
    player.facing = (aim.x + cam.x) >= handCx ? 1 : -1;
  }

  /* =========================================================
     Render — Minecraft blocks
     ========================================================= */
  function drawGrassBlock(c, x, y) {
    const s = BLOCK;
    c.fillStyle = COL.dirt;
    c.fillRect(x, y, s, s);
    // dirt specks
    for (let i = 0; i < 6; i++) {
      const hx = hash2(x, y, i);
      const hy = hash2(x + 1, y, i * 3);
      const px = x + Math.floor(hx * (s - 6)) + 3;
      const py = y + Math.floor(hy * (s - 6)) + 3;
      c.fillStyle = hx > 0.5 ? COL.dirtDark : COL.dirtDarker;
      c.fillRect(px, py, 3, 3);
    }
    // grass top
    c.fillStyle = COL.grassTop;
    c.fillRect(x, y, s, 10);
    // grass darker
    c.fillStyle = COL.grassTopDark;
    c.fillRect(x, y + 8, s, 3);
    // grass blade pixels
    for (let i = 0; i < 5; i++) {
      const hx = hash2(x, y, i * 7);
      const px = x + Math.floor(hx * s);
      c.fillStyle = COL.grassTop;
      c.fillRect(px, y + 10, 2, 2);
    }
  }

  function drawDirtBlock(c, x, y) {
    const s = BLOCK;
    c.fillStyle = COL.dirt;
    c.fillRect(x, y, s, s);
    for (let i = 0; i < 8; i++) {
      const hx = hash2(x, y, i);
      const hy = hash2(x + 2, y, i * 5);
      const px = x + Math.floor(hx * (s - 6)) + 2;
      const py = y + Math.floor(hy * (s - 6)) + 2;
      c.fillStyle = hx > 0.5 ? COL.dirtDark : COL.dirtDarker;
      c.fillRect(px, py, 3, 3);
    }
  }

  function drawStoneBlock(c, x, y) {
    const s = BLOCK;
    c.fillStyle = COL.stone;
    c.fillRect(x, y, s, s);
    for (let i = 0; i < 8; i++) {
      const hx = hash2(x, y, i * 11);
      const hy = hash2(x + 4, y, i * 13);
      const px = x + Math.floor(hx * (s - 8)) + 3;
      const py = y + Math.floor(hy * (s - 8)) + 3;
      c.fillStyle = hx > 0.5 ? COL.stoneDark : COL.stoneDarker;
      c.fillRect(px, py, 4, 4);
    }
  }

  function drawWoodBlock(c, x, y) {
    const s = BLOCK;
    c.fillStyle = COL.wood;
    c.fillRect(x, y, s, s);
    // vertical grain
    c.fillStyle = COL.woodDark;
    for (let i = 0; i < 4; i++) {
      const hx = hash2(x, y, i * 3);
      const px = x + Math.floor(hx * s);
      c.fillRect(px, y, 2, s);
    }
    c.fillStyle = COL.woodDarker;
    c.fillRect(x, y, s, 2);
    c.fillRect(x, y + s - 2, s, 2);
  }

  function drawBlocks(c, viewL, viewR, viewT, viewB) {
    // ground
    const c0 = Math.max(0, Math.floor(viewL / BLOCK));
    const c1 = Math.min(Math.ceil(WORLD_W / BLOCK), Math.ceil(viewR / BLOCK));
    for (let col = c0; col <= c1; col++) {
      const x = col * BLOCK;
      drawGrassBlock(c, x, GROUND_Y);
      for (let y = GROUND_Y + BLOCK; y < Math.min(viewB + BLOCK, WORLD_H + 400); y += BLOCK) {
        if (hash2(col, y, 99) > 0.82) drawStoneBlock(c, x, y);
        else drawDirtBlock(c, x, y);
      }
    }

    // platforms
    for (const p of world.platforms) {
      for (let cx = 0; cx < p.w; cx++) {
        for (let cy = 0; cy < p.h; cy++) {
          const x = (p.x + cx) * BLOCK;
          const y = (p.y + cy) * BLOCK;
          if (x < viewL - BLOCK || x > viewR + BLOCK) continue;
          if (y < viewT - BLOCK || y > viewB + BLOCK) continue;
          if (p.type === "stone") drawStoneBlock(c, x, y);
          else drawWoodBlock(c, x, y);
        }
      }
    }

    // side walls
    for (let y = 0; y < GROUND_Y; y += BLOCK) {
      drawStoneBlock(c, -BLOCK, y);
      drawStoneBlock(c, WORLD_W, y);
    }
  }

  /* =========================================================
     Sky
     ========================================================= */
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, COL.skyHigh);
    g.addColorStop(1, COL.sky);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // sun (square, pixel-style)
    const sunX = W - 160 - cam.x * 0.04;
    const sunY = 100 - cam.y * 0.04;
    ctx.fillStyle = COL.sun;
    ctx.fillRect(sunX, sunY, 64, 64);
    ctx.fillStyle = "rgba(255,240,150,0.35)";
    ctx.fillRect(sunX - 8, sunY - 8, 80, 80);
    ctx.fillStyle = COL.sun;
    ctx.fillRect(sunX, sunY, 64, 64);

    // clouds (parallax)
    const cloudOffset = -cam.x * 0.15;
    ctx.fillStyle = COL.cloud;
    const clouds = [
      [100, 80, 3, 1],
      [400, 140, 4, 1],
      [750, 100, 5, 2],
      [1100, 160, 3, 1],
      [1500, 90, 4, 1],
      [1900, 130, 5, 2],
      [2400, 110, 3, 1]
    ];
    for (const cl of clouds) {
      const bx = cl[0] + cloudOffset;
      const by = cl[1];
      for (let i = 0; i < cl[2]; i++) {
        for (let j = 0; j < cl[3]; j++) {
          ctx.fillRect(bx + i * 32 - (j % 2) * 16, by + j * 24, 36, 24);
        }
      }
    }
  }

  /* =========================================================
     Player sprite (Minecraft Steve-like)
     ========================================================= */
  function drawPlayer() {
    const px = player.x;
    const py = player.y;
    const w = player.w;
    const h = player.h;
    const f = player.facing;

    // shadow
    ctx.fillStyle = "rgba(0,0,0,0.28)";
    ctx.fillRect(px + 2, py + h - 2, w - 4, 4);

    ctx.save();
    ctx.translate(px + w / 2, py + h);
    if (f === -1) ctx.scale(-1, 1);

    // legs (walk cycle)
    const legPhase = Math.sin(player.walkPhase) * player.walkAmount;
    const legSwing = legPhase * 12;

    // left leg
    ctx.fillStyle = COL.pants;
    ctx.fillRect(-10 + legSwing * 0.5, -30, 9, 30);
    ctx.fillStyle = COL.pantsDark;
    ctx.fillRect(-10 + legSwing * 0.5, -30, 9, 3);

    // right leg
    ctx.fillStyle = COL.pants;
    ctx.fillRect(1 - legSwing * 0.5, -30, 9, 30);
    ctx.fillStyle = COL.pantsDark;
    ctx.fillRect(1 - legSwing * 0.5, -30, 9, 3);

    // body
    ctx.fillStyle = COL.shirt;
    ctx.fillRect(-11, -52, 22, 22);
    ctx.fillStyle = COL.shirtDark;
    ctx.fillRect(-11, -52, 22, 3);

    // left arm
    ctx.fillStyle = COL.shirt;
    ctx.fillRect(-17, -50, 6, 20);
    ctx.fillStyle = COL.skin;
    ctx.fillRect(-17, -32, 6, 6);

    // right arm (aiming arm — position it toward crosshair)
    const hand = getHandPos();
    const handLocalX = (hand.x - (player.x + player.w / 2)) * f;
    const handLocalY = hand.y - (player.y + player.h);

    // head
    ctx.fillStyle = COL.skin;
    ctx.fillRect(-9, -72, 18, 20);
    // hair
    ctx.fillStyle = COL.hair;
    ctx.fillRect(-9, -72, 18, 5);
    ctx.fillRect(-9, -67, 3, 4);
    ctx.fillRect(6, -67, 3, 4);
    // eyes
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(-6, -62, 4, 3);
    ctx.fillRect(2, -62, 4, 3);
    ctx.fillStyle = "#1c1c1c";
    ctx.fillRect(-5, -62, 2, 3);
    ctx.fillRect(3, -62, 2, 3);

    ctx.restore();

    // Arms + gun (in world space, rotated toward aim)
    drawGunAndArms(hand);
  }

  function drawGunAndArms(hand) {
    const aimWorldX = aim.x + cam.x;
    const aimWorldY = aim.y + cam.y;
    const angle = Math.atan2(aimWorldY - hand.y, aimWorldX - hand.x);
    const flip = Math.abs(angle) > Math.PI / 2;

    ctx.save();
    ctx.translate(hand.x, hand.y);
    ctx.rotate(angle);
    if (flip) ctx.scale(1, -1);

    // forward arm
    ctx.fillStyle = COL.shirt;
    ctx.fillRect(-4, -4, 12, 8);
    ctx.fillStyle = COL.skin;
    ctx.fillRect(6, -4, 8, 8);

    // gun (M4-ish)
    ctx.fillStyle = "#2c2c2c";
    ctx.fillRect(2, -5, 42, 10);
    ctx.fillStyle = "#1c1c1c";
    ctx.fillRect(40, -4, 10, 5);   // barrel
    ctx.fillRect(2, 5, 12, 8);     // magazine
    ctx.fillStyle = "#3c3c3c";
    ctx.fillRect(2, -5, 42, 2);    // top highlight
    ctx.fillStyle = "#202020";
    ctx.fillRect(30, -8, 6, 3);    // sight

    // muzzle flash
    if (state.muzzleFlash > 0.05) {
      const f = state.muzzleFlash;
      ctx.fillStyle = "rgba(255, 220, 120, " + (f * 0.9).toFixed(3) + ")";
      ctx.beginPath();
      ctx.moveTo(50, 0);
      ctx.lineTo(60 + f * 10, -6);
      ctx.lineTo(56, 0);
      ctx.lineTo(60 + f * 10, 6);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "rgba(255, 245, 180, " + f.toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(52, 0, 4 + f * 4, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  /* =========================================================
     Dummy sprite (training dummy — post + target head)
     ========================================================= */
  function drawDummy(d) {
    const cx = d.x;
    const bottomY = d.y + d.h;

    ctx.save();
    if (!d.alive) {
      // rotate on the ground
      ctx.translate(cx, bottomY);
      ctx.rotate(d.falling * Math.PI / 2);
      ctx.translate(-cx, -bottomY);
    } else {
      // idle sway
      const s = Math.sin(d.sway) * 0.02;
      ctx.translate(cx, bottomY);
      ctx.rotate(s);
      ctx.translate(-cx, -bottomY);
    }

    const w = d.w, h = d.h;

    // shadow
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.fillRect(cx - w / 2 + 2, bottomY - 3, w - 4, 3);

    // post (base)
    ctx.fillStyle = COL.woodDark;
    ctx.fillRect(cx - 6, bottomY - 18, 12, 18);
    ctx.fillStyle = COL.wood;
    ctx.fillRect(cx - 6, bottomY - 18, 12, 3);

    // straw body
    ctx.fillStyle = COL.straw;
    ctx.fillRect(cx - w / 2 + 2, d.y + 22, w - 4, h - 22 - 18);
    ctx.fillStyle = COL.strawDark;
    for (let i = 0; i < 5; i++) {
      ctx.fillRect(cx - w / 2 + 4 + i * 5, d.y + 26, 2, h - 22 - 22);
    }
    // horizontal strap
    ctx.fillStyle = COL.woodDarker;
    ctx.fillRect(cx - w / 2 + 2, d.y + 40, w - 4, 4);

    // head — target block
    const hx = cx - 16;
    const hy = d.y;
    ctx.fillStyle = COL.wood;
    ctx.fillRect(hx, hy, 32, 22);
    ctx.fillStyle = COL.woodDark;
    ctx.fillRect(hx, hy, 32, 3);
    ctx.fillRect(hx, hy + 19, 32, 3);

    // target rings on head
    ctx.fillStyle = COL.targetWhite;
    ctx.beginPath(); ctx.arc(cx, hy + 11, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = COL.targetRed;
    ctx.beginPath(); ctx.arc(cx, hy + 11, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = COL.targetWhite;
    ctx.beginPath(); ctx.arc(cx, hy + 11, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = COL.targetRed;
    ctx.beginPath(); ctx.arc(cx, hy + 11, 1.4, 0, Math.PI * 2); ctx.fill();

    // HP pips above head
    if (d.alive) {
      for (let i = 0; i < d.maxHp; i++) {
        const px = cx - (d.maxHp * 5) / 2 + i * 6;
        ctx.fillStyle = i < d.hp ? "#7cbd4a" : "#5a2020";
        ctx.fillRect(px, d.y - 8, 5, 3);
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.strokeStyle = "rgba(0,0,0,0.6)";
        ctx.strokeRect(px + 0.5, d.y - 8.5, 5, 3);
      }
    }

    // hit flash
    if (d.hitFlash > 0) {
      ctx.fillStyle = "rgba(255, 240, 200, " + (d.hitFlash * 0.6).toFixed(3) + ")";
      ctx.fillRect(cx - w / 2, d.y, w, h);
    }

    ctx.restore();
  }

  /* =========================================================
     Bullets
     ========================================================= */
  function drawBullets() {
    for (const b of state.bullets) {
      ctx.strokeStyle = COL.bullet;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(b.px, b.py);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();

      ctx.fillStyle = "#fff6c0";
      ctx.fillRect(b.x - 1.5, b.y - 1.5, 3, 3);
    }
  }

  /* =========================================================
     Crosshair
     ========================================================= */
  function drawCrosshair() {
    const x = aim.x, y = aim.y;
    ctx.strokeStyle = "#ffd566";
    ctx.lineWidth = 2;
    const gap = 5, len = 10;
    ctx.beginPath();
    ctx.moveTo(x, y - gap); ctx.lineTo(x, y - gap - len);
    ctx.moveTo(x, y + gap); ctx.lineTo(x, y + gap + len);
    ctx.moveTo(x - gap, y); ctx.lineTo(x - gap - len, y);
    ctx.moveTo(x + gap, y); ctx.lineTo(x + gap + len, y);
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x - 1, y - 1, 2, 2);
  }

  /* =========================================================
     Render
     ========================================================= */
  function render() {
    drawSky();

    ctx.save();
    ctx.translate(-cam.x, -cam.y);

    const viewL = cam.x;
    const viewR = cam.x + W;
    const viewT = cam.y;
    const viewB = cam.y + H;

    drawBlocks(ctx, viewL, viewR, viewT, viewB);
    for (const d of world.dummies) drawDummy(d);
    drawPlayer();
    drawBullets();

    ctx.restore();

    drawCrosshair();
  }

  /* =========================================================
     HUD
     ========================================================= */
  function updateHud() {
    hudScore.textContent = state.score;
    hudKills.textContent = state.kills;
    hudCombo.textContent = "x" + state.combo;

    if (state.reloading) {
      hudAmmo.textContent = "RELOAD";
      hudAmmoChip.classList.add("reloading");
      hudAmmoChip.classList.remove("empty");
    } else {
      hudAmmo.textContent = state.ammo + " / " + MAG_SIZE;
      hudAmmoChip.classList.toggle("empty", state.ammo === 0);
      hudAmmoChip.classList.remove("reloading");
    }
  }

  /* =========================================================
     Game flow
     ========================================================= */
  function startGame() {
    try {
      initAudio();
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    } catch (err) {
      console.warn("Audio init failed on start:", err);
    }

    player.x = 3 * BLOCK;
    player.y = GROUND_Y - player.h - 4;
    player.vx = 0;
    player.vy = 0;
    player.facing = 1;
    player.walkPhase = 0;
    player.walkAmount = 0;

    aim.x = W / 2;
    aim.y = H / 2;

    state.score = 0;
    state.kills = 0;
    state.combo = 1;
    state.comboTimer = 0;
    state.ammo = MAG_SIZE;
    state.reloading = false;
    state.reloadEndAt = 0;
    state.lastShotAt = 0;
    state.bullets.length = 0;
    state.muzzleFlash = 0;
    state.running = true;

    generateWorld();
    spawnDummiesInitial();

    cam.x = player.x - W / 2;
    cam.y = player.y - H / 2;

    overlay.classList.add("hidden");
    updateHud();
  }

  /* =========================================================
     Loop
     ========================================================= */
  let lastT = performance.now();
  function loop(t) {
    try {
      let dt = (t - lastT) / 1000;
      if (dt > 0.05) dt = 0.05;
      lastT = t;

      if (state.running) update(dt);
      render();
    } catch (err) {
      console.error("Frame error (recovering):", err);
      state.running = false;
    }

    requestAnimationFrame(loop);
  }

  /* =========================================================
     Boot
     ========================================================= */
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  window.addEventListener("resize", resize);
  startBtn.addEventListener("click", startGame);

  resize();
  aim.x = W / 2;
  aim.y = H / 2;

  // pre-generate world so menu can sit over a live scene
  generateWorld();
  spawnDummiesInitial();
  player.y = GROUND_Y - player.h - 4;
  cam.x = player.x - W / 2;
  cam.y = player.y - H / 2;

  requestAnimationFrame(loop);
})();
</script>
</body>
