<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Is Ghar Mein Koi Hai...</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nosifer&display=swap" rel="stylesheet">
<style>
  :root{
    --blood:#b3001b;
    --glow:#ff2e2e;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:'Nosifer', cursive;
    color:#ddd;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .vignette{
    position:fixed;inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.85) 100%);
    z-index:5;
  }
  #intro{
    text-align:center;
    padding:20px;
    z-index:2;
  }
  #intro h1{
    font-family:'Creepster', cursive;
    font-size:clamp(2rem,7vw,4rem);
    color:var(--blood);
    text-shadow:0 0 8px var(--glow), 0 0 20px var(--glow);
    animation:flicker 2.5s infinite;
  }
  @keyframes flicker{
    0%,19%,21%,23%,25%,54%,56%,100%{opacity:1;}
    20%,22%,24%,55%{opacity:0.3;}
  }
  #intro p{
    margin-top:18px;
    font-family:sans-serif;
    color:#888;
    font-size:0.95rem;
    letter-spacing:1px;
  }
  #enterBtn{
    margin-top:35px;
    padding:14px 34px;
    background:transparent;
    border:2px solid var(--blood);
    color:var(--glow);
    font-family:'Nosifer',cursive;
    font-size:1rem;
    cursor:pointer;
    letter-spacing:2px;
    transition:.25s;
  }
  #enterBtn:hover{
    background:var(--blood);
    color:#000;
    box-shadow:0 0 25px var(--glow);
  }
  #typedLine{
    min-height:1.4em;
    font-family:monospace;
    color:#4dff4d;
    margin-top:20px;
    font-size:1rem;
  }
  /* Scan / suspense screen */
  #scan{
    display:none;
    text-align:center;
    z-index:2;
    width:80%;
    max-width:420px;
  }
  #scan h2{
    font-family:monospace;
    color:#4dff4d;
    margin-bottom:14px;
    font-size:1rem;
  }
  .bar{
    width:100%;
    height:22px;
    border:2px solid #4dff4d;
    position:relative;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    width:0%;
    background:repeating-linear-gradient(45deg,#4dff4d,#4dff4d 10px,#1a1a1a 10px,#1a1a1a 20px);
    transition:width .05s linear;
  }
  /* Jumpscare screen */
  #scare{
    display:none;
    position:fixed;
    inset:0;
    background:#000;
    z-index:20;
    align-items:center;
    justify-content:center;
  }
  #scare svg{
    width:70vw;
    max-width:480px;
    filter:drop-shadow(0 0 40px red);
  }
