<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Reading — Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-a:#fbe4ff;
    --bg-b:#dff6f2;
    --ink:#3a2e52;
    --ink-soft:#6b5f8a;
    --coral:#ff6f91;
    --gold:#ffc85c;
    --mint:#69dcb0;
    --violet:#9b7bf0;
    --radius:28px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    font-family:'Quicksand',sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg,var(--bg-a),var(--bg-b));
  }
  .card{
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(6px);
    border-radius:var(--radius);
    padding:40px 34px;
    max-width:460px;width:100%;
    box-shadow:0 30px 60px -20px rgba(58,46,82,0.25);
  }
  .progress-track{
    height:8px;border-radius:999px;background:rgba(155,123,240,0.15);
    overflow:hidden;margin-bottom:28px;
  }
  .progress-fill{
    height:100%;border-radius:999px;
    background:linear-gradient(90deg,var(--violet),var(--coral));
    width:33.33%;transition:width 0.35s ease;
  }
  .step{display:none;}
  .step.active{display:block;animation:fadeIn 0.3s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  h2{
    font-family:'Baloo 2',cursive;
    font-size:24px;margin:0 0 22px;line-height:1.25;
  }
  .options{display:flex;flex-direction:column;gap:12px;}
  .option{
    text-align:left;
    font-family:'Quicksand',sans-serif;
    font-size:16px;font-weight:600;
    color:var(--ink);
    background:#fff;
    border:2px solid rgba(155,123,240,0.18);
    border-radius:16px;
    padding:14px 18px;
    cursor:pointer;
    transition:border-color 0.15s ease, transform 0.1s ease;
  }
  .option:hover{border-color:var(--violet);}
  .option.selected{
    border-color:var(--violet);
    background:rgba(155,123,240,0.12);
  }
  .option:focus-visible{outline:3px solid var(--violet);outline-offset:2px;}
  .swatches{display:flex;gap:14px;justify-content:space-between;}
  .swatch{
    flex:1;aspect-ratio:1;border-radius:18px;border:3px solid transparent;
    cursor:pointer;transition:transform 0.1s ease, border-color 0.15s ease;
  }
  .swatch:hover{transform:translateY(-3px);}
  .swatch.selected{border-color:var(--ink);}
  .nav-row{display:flex;justify-content:flex-end;margin-top:28px;}
  .btn-next{
    font-family:'Quicksand',sans-serif;font-weight:700;font-size:16px;
    color:#fff;background:linear-gradient(135deg,var(--violet),var(--coral));
    border:none;padding:14px 28px;border-radius:999px;cursor:pointer;
    opacity:0.4;pointer-events:none;
    transition:opacity 0.2s ease, transform 0.15s ease;
  }
  .btn-next.enabled{opacity:1;pointer-events:auto;}
  .btn-next:hover{transform:translateY(-2px);}
  .btn-next:focus-visible{outline:3px solid var(--violet);outline-offset:3px;}
</style>
</head>
<body>
  <main class="card">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

    <section class="step active" data-step="1">
      <h2>Where would you rather be right now?</h2>
      <div class="options" data-question="1">
        <button class="option">A rooftop at golden hour</button>
        <button class="option">Deep in a quiet forest</button>
        <button class="option">The middle of a night market</button>
        <button class="option">Curled up somewhere cosy</button>
      </div>
    </section>

    <section class="step" data-step="2">
      <h2>Pick the colour that's calling to you</h2>
      <div class="swatches" data-question="2">
        <div class="swatch" style="background:#9b7bf0" data-value="violet"></div>
        <div class="swatch" style="background:#69dcb0" data-value="mint"></div>
        <div class="swatch" style="background:#ff6f91" data-value="coral"></div>
        <div class="swatch" style="background:#ffc85c" data-value="gold"></div>
      </div>
    </section>

    <section class="step" data-step="3">
      <h2>Your ideal Friday night?</h2>
      <div class="options" data-question="3">
        <button class="option">Dancing till 2am</button>
        <button class="option">A long drive, no destination</button>
        <button class="option">Tea and a good book</button>
        <button class="option">One deep conversation, one person</button>
      </div>
    </section>

    <div class="nav-row">
      <button class="btn-next" id="nextBtn">Next</button>
    </div>
  </main>

<script>
  const totalSteps = 3;
  let current = 1;
  const progressFill = document.getElementById('progressFill');
  const nextBtn = document.getElementById('nextBtn');

  function selectOption(container, el){
    container.querySelectorAll('.option, .swatch').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    nextBtn.classList.add('enabled');
  }

  document.querySelectorAll('[data-question]').forEach(container => {
    container.addEventListener('click', (e) => {
      const el = e.target.closest('.option, .swatch');
      if (el) selectOption(container, el);
    });
  });

  nextBtn.addEventListener('click', () => {
    if (current < totalSteps){
      document.querySelector(`[data-step="${current}"]`).classList.remove('active');
      current += 1;
      document.querySelector(`[data-step="${current}"]`).classList.add('active');
      progressFill.style.width = ((current) / totalSteps * 100) + '%';
      nextBtn.classList.remove('enabled');
      nextBtn.textContent = current === totalSteps ? 'See my aura' : 'Next';
    } else {
      window.location.href = 'result.html';
    }
  });
</script>
</body>
</html>
